name: Keep Streamlit Apps Awake

on:
  schedule:
    # Runs every hour on the hour
    - cron: "0 * * * *"
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Factory AI Demo
        run: |
          curl -s -o /dev/null -w "Demo app pinged at $(date -u +'%Y-%m-%d %H:%M:%S UTC'). Status code: %{http_code}\n" https://factory-ai-demo.streamlit.app

      - name: Ping Factory AI v3
        run: |
          curl -s -o /dev/null -w "v3 app pinged at $(date -u +'%Y-%m-%d %H:%M:%S UTC'). Status code: %{http_code}\n" https://factory-ai-v3.streamlit.app
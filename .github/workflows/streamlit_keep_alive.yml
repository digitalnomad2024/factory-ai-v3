name: Keep Streamlit Apps Awake

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Factory AI Demo
        run: |
          curl -s -o /dev/null -w "Demo ping at $(date -u +'%Y-%m-%d %H:%M:%S UTC') — status: %{http_code}\n" https://factory-ai-demo.streamlit.app

      - name: Ping Factory AI v3
        run: |
          curl -s -o /dev/null -w "v3 ping at $(date -u +'%Y-%m-%d %H:%M:%S UTC') — status: %{http_code}\n" https://factory-ai-v3.streamlit.app